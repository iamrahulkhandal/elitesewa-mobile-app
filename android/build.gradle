buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def nodeBinary = (findProperty('NODE_BINARY') ?: 'node').toString()

ext {
    react = [
        nodeExecutableAndArgs: [nodeBinary],
    ]
}

gradle.beforeProject { Project p ->
    p.plugins.whenPluginAdded { plugin ->
        def pluginClassName = plugin.getClass().getName()
        def isAndroidLibrary = pluginClassName == 'com.android.build.gradle.LibraryPlugin'
        def isAndroidApp = pluginClassName == 'com.android.build.gradle.AppPlugin'

        if (isAndroidLibrary || isAndroidApp) {
            if (p.hasProperty('android')) {
                p.android {
                    compileSdk rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}
